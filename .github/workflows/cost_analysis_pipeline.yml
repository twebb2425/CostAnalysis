# Gives the GitHub Actions workflow a readable name.
name: CostAnalysis ETL Pipeline

# Defines when the workflow should run.
on:

  # Allows us to manually run the workflow from the GitHub Actions page.
  workflow_dispatch:

  # Runs the workflow automatically on a schedule.
  schedule:

    # Runs every Monday at 8:00 AM Eastern Time.
    - cron: "0 8 * * 1"
      timezone: "America/New_York"


# Defines the jobs that GitHub Actions will execute.
jobs:

  # Creates the main ETL job.
  run-etl:

    # Uses GitHub's latest Ubuntu runner.
    runs-on: ubuntu-latest

    # Defines environment variables available to the Python pipeline.
    env:

      # Passes the Census API key from GitHub repository secrets.
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}

      # Passes the PostgreSQL connection string from GitHub repository secrets.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}


    # Defines the individual steps in the ETL job.
    steps:

      # Downloads the repository code onto the GitHub Actions runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installs Python on the GitHub Actions runner.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:

          # Uses Python 3.13 to match the local project environment.
          python-version: "3.13"

      # Upgrades pip before installing project dependencies.
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # Installs all Python libraries listed in requirements.txt.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Runs the complete CostAnalysis ETL pipeline.
      - name: Run CostAnalysis ETL pipeline
        run: python run_pipeline.py